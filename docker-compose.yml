services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acemock
      POSTGRES_PASSWORD: acemock
      POSTGRES_DB: acemock
    ports:
      - "5432:5432"
    volumes:
      - acemock_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acemock"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://acemock:acemock@db:5432/acemock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  acemock_pg:
